<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="香港中學數學互動教材與 DSE 操練網站入口。">
  <title>數學研習室 | 教材總覽</title>
  <style>
    :root {
      --ink: #19312f;
      --muted: #526664;
      --line: #d7e2de;
      --paper: #f6f8f7;
      --white: #fff;
      --teal: #08786e;
      --teal-pale: #e4f4ef;
      --coral: #c84c66;
      --coral-pale: #fff0f3;
      --blue: #286d9e;
      --blue-pale: #eaf3f9;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
      line-height: 1.65;
    }
    a { color: inherit; }
    a:focus-visible { outline: 3px solid var(--teal); outline-offset: 4px; }
    .wrap { width: min(1100px, calc(100% - 40px)); margin-inline: auto; }
    .topbar { background: var(--ink); color: var(--white); }
    .topbar-inner { min-height: 66px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 11px; text-decoration: none; font-size: 15px; font-weight: 800; white-space: nowrap; }
    .brand-mark { width: 33px; height: 33px; display: grid; place-items: center; border: 1px solid #89bdb1; color: #a4e0d2; font: 22px Georgia, serif; }
    .topbar nav { display: flex; gap: 22px; }
    .topbar nav a { color: #d4e2dd; font-size: 13px; text-decoration: none; }
    .topbar nav a:hover { color: var(--white); text-decoration: underline; text-underline-offset: 5px; }
    main { padding-bottom: 80px; }
    .intro { padding: 42px 0 37px; }
    .eyebrow { margin: 0 0 10px; color: var(--teal); font-size: 12px; font-weight: 800; }
    h1 { margin: 0; font-size: clamp(30px, 3.2vw, 40px); line-height: 1.3; letter-spacing: 0; }
    .lead { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
    .grade { scroll-margin-top: 22px; }
    .grade + .grade { margin-top: 37px; }
    .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-bottom: 11px; border-bottom: 1px solid var(--line); }
    h2 { margin: 0; font-size: 21px; line-height: 1.35; letter-spacing: 0; }
    .count { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .sites { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
    .topic {
      position: relative;
      min-width: 0;
      min-height: 132px;
      display: flex;
      align-items: flex-start;
      gap: 13px;
      padding: 18px 17px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--white);
      text-decoration: none;
      transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
    }
    .topic:hover { border-color: #9acac0; box-shadow: 0 8px 20px rgba(12, 72, 62, .07); transform: translateY(-2px); }
    .topic-icon { flex: none; width: 50px; height: 50px; display: grid; place-items: center; border-radius: 5px; background: var(--teal-pale); color: var(--teal); }
    .topic-icon.coral { background: var(--coral-pale); color: var(--coral); }
    .topic-icon.blue { background: var(--blue-pale); color: var(--blue); }
    .topic-icon svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .topic-content { min-width: 0; padding-right: 14px; }
    .subject { display: block; margin-bottom: 3px; color: var(--muted); font-size: 11px; font-weight: 700; }
    h3 { margin: 0; font-size: 18px; line-height: 1.4; letter-spacing: 0; }
    .description { display: block; margin: 6px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .arrow { position: absolute; top: 18px; right: 16px; color: var(--teal); font-size: 18px; line-height: 1; }
    footer { border-top: 1px solid var(--line); padding: 23px 0 34px; color: var(--muted); font-size: 12px; }
    @media (max-width: 900px) {
      .sites { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .wrap { width: min(100% - 32px, 480px); }
      .topbar-inner { min-height: 60px; }
      .topbar nav { gap: 14px; }
      .intro { padding: 34px 0 30px; }
      .sites { grid-template-columns: 1fr; }
      .topic { min-height: 106px; padding: 15px; }
      .arrow { top: 15px; right: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .topic { transition: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#main" aria-label="數學研習室，前往教材總覽"><span class="brand-mark" aria-hidden="true">△</span>數學研習室</a>
      <nav aria-label="年級導覽"><a href="#s2">中二</a><a href="#s3">中三</a></nav>
    </div>
  </header>
  <main id="main" class="wrap">
    <div class="intro">
      <p class="eyebrow">學習資源</p>
      <h1>數學教材總覽</h1>
      <p class="lead">按年級選擇課題，從概念開始學起。</p>
    </div>
    <section class="grade" id="s2" aria-labelledby="s2-title">
      <div class="section-head">
        <h2 id="s2-title">中二</h2>
        <span class="count">2 個教材</span>
      </div>
      <div class="sites">
        <a class="topic" href="https://ctyingfun-dev.github.io/similar-triangles-dse/">
          <span class="topic-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path d="M5 39 21 8l21 31H5Z"/><path d="m14 24 18 1M21 8l-2 9"/><circle cx="21" cy="8" r="2" fill="currentColor" stroke="none"/></svg>
          </span>
          <div class="topic-content">
            <span class="subject">幾何 · 互動教材</span>
            <h3>相似三角形</h3>
            <span class="description">相似判定與「邊邊角」反例</span>
          </div>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="topic" href="identities-s2.html">
          <span class="topic-icon coral" aria-hidden="true">
            <svg viewBox="0 0 48 48"><rect x="5" y="5" width="38" height="38" rx="1"/><path d="M30 5v38M5 30h38"/><path d="M30 30h13v13H30z" fill="currentColor" fill-opacity=".18" stroke="none"/></svg>
          </span>
          <div class="topic-content">
            <span class="subject">代數 · 互動教材</span>
            <h3>恆等式</h3>
            <span class="description">完全平方與平方差的面積圖解</span>
          </div>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </section>
    <section class="grade" id="s3" aria-labelledby="s3-title">
      <div class="section-head">
        <h2 id="s3-title">中三</h2>
        <span class="count">1 個教材</span>
      </div>
      <div class="sites">
        <a class="topic" href="integer-index-laws-s3.html">
          <span class="topic-icon blue" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path d="M5 41h38M9 41V9h9v32M18 18h9v23M27 26h9v15"/><path d="M11 6h5M20 15h5M29 23h5"/></svg>
          </span>
          <div class="topic-content">
            <span class="subject">代數 · 互動教材</span>
            <h3>整數指數定律</h3>
            <span class="description">正、零、負指數與七條運算定律</span>
          </div>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </div>
    </section>
  </main>
  <footer><div class="wrap">數學研習室 · 香港中學數學</div></footer>
</body>
</html>
